# Конфигурация CodeQL для AnOOPlan.
#
# Анализируем только исходники, которые пишем сами. Артефакты сборки, сторонние
# пакеты, результаты тестов и Android-ассеты в анализ не входят: они не
# сопровождаются нами и создают шум в отчётах безопасности.
#
# Правила здесь НЕ отключаются: точечные подавления живут рядом с кодом
# (// codeql[js/...] — <причина>).
name: AnOOPlan CodeQL config

paths-ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/coverage/**'
  - '**/test-results/**'
  - 'android/assets/**'
  - 'tools/**'
