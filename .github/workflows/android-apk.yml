name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # На образах GitHub Android SDK уже установлен: берём из него build-tools и платформу,
      # поэтому apt-get и скачивание SDK не нужны.
      - name: Инструменты Android из образа раннера
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$SDK/build-tools/35.0.0"
          PLATFORM="$SDK/platforms/android-35"
          if [ ! -x "$BT/aapt" ] || [ ! -f "$PLATFORM/android.jar" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
            [ -n "$SDKMANAGER" ] || { echo "Нет sdkmanager для установки build-tools 35" >&2; exit 1; }
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "build-tools;35.0.0" "platforms;android-35"
          fi
          {
            echo "ANDROID_JAR=$PLATFORM/android.jar"
            echo "AAPT=$BT/aapt"
            echo "ZIPALIGN=$BT/zipalign"
            echo "APKSIGNER=$BT/apksigner"
            echo "D8_CMD=$BT/d8"
          } >> "$GITHUB_ENV"
          echo "build-tools: $BT"
          echo "platform:    $PLATFORM"
          "$BT/aapt" version
          "$BT/d8" --version || true

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Дымовой тест интерфейса
        run: npm run smoke

      - name: Кэш браузеров Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Браузер для E2E
        run: npx playwright install --with-deps chromium

      - name: E2E с реальным PDF
        run: npm run test:ui

      # CI не подписывает APK: ключ не должен генерироваться в раннере.
      # Подписанный релиз собирает android-release.yml из секретов.
      - name: Сборка APK (без подписи)
        env:
          UNSIGNED_APK: '1'
        run: bash scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AnOOPlan-apk-unsigned
          path: build/AnOOPlan-*-unsigned.apk
          if-no-files-found: error
