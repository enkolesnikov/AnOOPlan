name: CI

# Быстрый обязательный прогон на каждый push/PR: типы, юнит-тесты, смоук и E2E.
# Pages и неподписанный APK собираются отдельно и только вручную (workflow_dispatch) —
# это убирает ~2–3 минуты runner-времени с каждого push, не теряя проверок.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Типы
        run: npx tsc --noEmit
      - name: Юнит-тесты с покрытием
        run: npm run coverage
      - name: Сборка и бюджет стартового бандла
        run: npm run build && npm run size
      - name: Дымовой тест интерфейса
        run: npm run smoke
      - name: Кэш браузеров Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Браузер для E2E
        run: npx playwright install --with-deps chromium
      - name: E2E с реальным PDF
        run: npm run test:ui
