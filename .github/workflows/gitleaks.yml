name: Gitleaks

# Поиск секретов в истории git и в изменениях PR. Локальная быстрая проверка —
# `npm run check:secrets`, полная — `gitleaks dir . --config .gitleaks.toml`.
# Пользовательских секретов не требуется: GITHUB_TOKEN выдаётся Actions автоматически
# (он нужен только для комментария в PR и ничего не публикует).
on:
  push:
    branches: [main]
  pull_request:
  # Полная история проверяется на schedule: action сканирует диапазон push/PR,
  # а по расписанию — всю историю (поэтому fetch-depth: 0).
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Вся история: нужна для schedule-скана и поиска секретов в старых коммитах.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Явно указываем конфиг из корня: стандартные правила + свои (см. .gitleaks.toml).
          GITLEAKS_CONFIG: .gitleaks.toml
          # Комментарии в PR выключены: у PR из форков токен read-only, а для нашей
          # задачи достаточно упавшего job. Это убирает зависимость от прав на запись.
          GITLEAKS_ENABLE_COMMENTS: 'false'
