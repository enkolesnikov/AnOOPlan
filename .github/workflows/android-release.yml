name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Инструменты Android из образа раннера
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$SDK/build-tools/35.0.0"
          PLATFORM="$SDK/platforms/android-35"
          if [ ! -x "$BT/aapt" ] || [ ! -f "$PLATFORM/android.jar" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
            [ -n "$SDKMANAGER" ] || { echo "Нет sdkmanager для установки build-tools 35" >&2; exit 1; }
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "build-tools;35.0.0" "platforms;android-35"
          fi
          {
            echo "ANDROID_JAR=$PLATFORM/android.jar"
            echo "AAPT=$BT/aapt"
            echo "ZIPALIGN=$BT/zipalign"
            echo "APKSIGNER=$BT/apksigner"
            echo "D8_CMD=$BT/d8"
          } >> "$GITHUB_ENV"
          "$BT/aapt" version

      - name: Зависимости
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Дымовой тест интерфейса
        run: npm run smoke

      - name: Кэш браузеров Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Полный quality gate
        run: |
          npx tsc --noEmit
          npm run lint
          npm run knip
          npm run coverage

      - name: Тег создан из проверенного main
        run: |
          git fetch origin main --depth=100
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Тег указывает на коммит вне main — релиз запрещён." >&2; exit 1; }

      - name: Браузер для E2E
        run: npx playwright install --with-deps chromium

      - name: E2E с реальным PDF
        run: npm run test:ui

      - name: Проверить наличие секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "Не задан секрет ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          [ -n "$KS_PASS" ] || { echo "Не задан секрет ANDROID_KS_PASS" >&2; exit 1; }

      - name: Восстановить keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/anooplan.jks
          chmod 600 keystore/anooplan.jks
          test -s keystore/anooplan.jks

      - name: Собрать подписанный APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KS_ALIAS }}
        run: bash scripts/build-apk.sh

      - name: Проверить сертификат подписи
        env:
          EXPECTED_CERT: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="$(ls build/AnOOPlan-*.apk | grep -v unsigned | head -1)"
          APKSIGNER="${APKSIGNER:-apksigner}"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          echo "SHA-256 сертификата: $CERT"
          if [ -n "$EXPECTED_CERT" ] && [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "Сертификат не совпадает с ANDROID_CERT_SHA256" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK" | head -12

      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK="$(ls build/AnOOPlan-*.apk | grep -v unsigned | head -1)"
          # Описание релиза — аннотация тега. actions/checkout для тега может оставить локальный
          # тег облегчённым, поэтому сначала спрашиваем объект тега через GitHub API, затем
          # локальную аннотацию и только в крайнем случае — сообщение коммита.
          NOTES=""
          TAG_OBJECT="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "$TAG_OBJECT" ]; then
            NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" --jq '.message' 2>/dev/null || true)"
          fi
          [ -n "$NOTES" ] || NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          [ -n "$NOTES" ] || NOTES="$(git log -1 --pretty=%B)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "AnOOPlan ${TAG#v}" --notes "$NOTES"
          fi

      - name: Удалить keystore с раннера
        if: always()
        run: rm -rf keystore
