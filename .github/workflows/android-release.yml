name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Тег соответствует версии package.json
        run: |
          set -euo pipefail
          VERSION_NAME="$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "v$VERSION_NAME" ] || {
            echo "Тег $GITHUB_REF_NAME не совпадает с версией $VERSION_NAME: релиз запрещён." >&2
            exit 1
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Инструменты Android из образа раннера
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$SDK/build-tools/35.0.0"
          PLATFORM="$SDK/platforms/android-35"
          if [ ! -x "$BT/aapt" ] || [ ! -f "$PLATFORM/android.jar" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
            [ -n "$SDKMANAGER" ] || { echo "Нет sdkmanager для установки build-tools 35" >&2; exit 1; }
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "build-tools;35.0.0" "platforms;android-35"
          fi
          {
            echo "ANDROID_JAR=$PLATFORM/android.jar"
            echo "AAPT=$BT/aapt"
            echo "ZIPALIGN=$BT/zipalign"
            echo "APKSIGNER=$BT/apksigner"
            echo "D8_CMD=$BT/d8"
          } >> "$GITHUB_ENV"
          "$BT/aapt" version

      - name: Проверить SHA инструментов Android
        run: bash scripts/verify-tools.sh

      - name: Зависимости
        run: npm ci

      - name: Проверка на секреты
        run: npm run check:secrets

      - name: Тесты
        run: npm test

      - name: Дымовой тест интерфейса
        run: npm run smoke

      - name: Кэш браузеров Playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Полный quality gate
        run: |
          npx tsc --noEmit
          npm run lint
          npm run knip
          npm run coverage
          npm run build
          npm run size

      - name: Тег создан из проверенного main
        run: |
          git fetch origin main --depth=100
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Тег указывает на коммит вне main — релиз запрещён." >&2; exit 1; }

      - name: Браузер для E2E
        run: npx playwright install --with-deps chromium

      - name: E2E с реальным PDF
        run: npm run test:ui

      - name: Проверить наличие секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "Не задан секрет ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          [ -n "$KS_PASS" ] || { echo "Не задан секрет ANDROID_KS_PASS" >&2; exit 1; }

      - name: Восстановить keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/anooplan.jks
          chmod 600 keystore/anooplan.jks
          test -s keystore/anooplan.jks

      - name: Собрать подписанный APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_KS_ALIAS }}
        run: bash scripts/build-apk.sh

      - name: Проверить сертификат, версию, разрешения и размер APK
        env:
          EXPECTED_CERT: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(node -p "require('./package.json').version")"
          APK="build/AnOOPlan-$VERSION_NAME.apk"
          [ -f "$APK" ] || { echo "Нет собранного APK: $APK" >&2; exit 1; }
          APKSIGNER="${APKSIGNER:-apksigner}"
          AAPT="${AAPT:-aapt}"

          # Пустой секрет не должен отключать проверку подписи.
          [ -n "$EXPECTED_CERT" ] || { echo "Не задан секрет ANDROID_CERT_SHA256: релиз без проверки сертификата запрещён" >&2; exit 1; }
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          echo "SHA-256 сертификата: $CERT"
          [ "$CERT" = "$EXPECTED_CERT" ] || { echo "Сертификат не совпадает с ANDROID_CERT_SHA256" >&2; exit 1; }
          "$APKSIGNER" verify --verbose "$APK" | head -12

          VERSION_NAME="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -p "String(require('./package.json').androidVersionCode)")"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"
          case "$BADGING" in
            *"versionCode='$VERSION_CODE'"*) ;;
            *) echo "versionCode APK не совпадает с package.json ($VERSION_CODE)" >&2; exit 1 ;;
          esac
          case "$BADGING" in
            *"versionName='$VERSION_NAME'"*) ;;
            *) echo "versionName APK не совпадает с package.json ($VERSION_NAME)" >&2; exit 1 ;;
          esac

          PERMS="$("$AAPT" dump permissions "$APK")"
          echo "$PERMS"
          if echo "$PERMS" | grep -q 'android.permission.INTERNET'; then
            echo "APK запрашивает INTERNET — офлайн-контракт нарушен" >&2
            exit 1
          fi
          # Разрешения — точный allowlist, а не только отсутствие INTERNET.
          EXTRA_PERMS="$(echo "$PERMS" | sed -n "s/^uses-permission: name='\(.*\)'$/\1/p" | grep -v '^android.permission.VIBRATE$' || true)"
          if [ -n "$EXTRA_PERMS" ]; then
            echo "Неожиданные разрешения APK: $EXTRA_PERMS" >&2
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"
          echo "Размер APK: $SIZE Б (бюджет 4194304)"
          [ "$SIZE" -le 4194304 ] || { echo "APK больше 4 МБ" >&2; exit 1; }
          sha256sum "$APK"

      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="$(node -p "require('./package.json').version")"
          APK="build/AnOOPlan-$VERSION_NAME.apk"
          [ -f "$APK" ] || { echo "Нет собранного APK: $APK" >&2; exit 1; }
          ( cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" ) > "$APK.sha256"
          # Описание релиза — аннотация тега. actions/checkout для тега может оставить локальный
          # тег облегчённым, поэтому сначала спрашиваем объект тега через GitHub API, затем
          # локальную аннотацию и только в крайнем случае — сообщение коммита.
          NOTES=""
          TAG_OBJECT="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "$TAG_OBJECT" ]; then
            NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" --jq '.message' 2>/dev/null || true)"
          fi
          [ -n "$NOTES" ] || NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          [ -n "$NOTES" ] || NOTES="$(git log -1 --pretty=%B)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --title "AnOOPlan ${TAG#v}" --notes "$NOTES"
          fi

      - name: Удалить keystore с раннера
        if: always()
        run: rm -rf keystore
