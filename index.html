<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- CSP: только свои скрипты/стили/шрифты; blob/data нужны для PDF, фото и worker. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <link rel="stylesheet" href="/webview-warning.css" />
    <!-- Цвет системной строки состояния: светлая и тёмная тема (значения — src/a11y.ts). -->
    <meta name="theme-color" content="#122936" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1a22" media="(prefers-color-scheme: dark)" />
    <title>AnOOPlan — кабельный план</title>
  </head>
  <body>
    <div id="webview-warning" hidden>
      <div class="card">
        <h1>Обновите системный WebView</h1>
        <p>AnOOPlan работает в Android System WebView. Установленная версия слишком старая: нужен Chrome/WebView 98 или новее (Android 7+).</p>
        <p>Откройте Google Play → «Android System WebView» → «Обновить». На некоторых устройствах WebView обновляется вместе с Chrome.</p>
        <button type="button" id="webview-continue">Продолжить всё равно</button>
      </div>
    </div>
    <div id="root"></div>
    <script src="/webview-guard.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
